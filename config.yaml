# ==============================================================================
# SSH Portfolio Configuration Template
# ==============================================================================
# To use this:
# 1. Copy this file: cp config.example.yaml config.yaml
# 2. Edit the values below with your own information.
# 3. Fields marked [REQUIRED] must be provided.
#    Fields marked [OPTIONAL] can be customized or deleted.
# ==============================================================================

# ------------------------------------------------------------------------------
# Profile Information
# ------------------------------------------------------------------------------
profile:
  name: "Jane Doe"                       # [REQUIRED] Your full name or handle (shown in header and SSH banner)
  tagline: "Software Engineer · Systems" # [OPTIONAL] Subtitle shown under your name
  ascii_logo: |                          # [OPTIONAL] Custom ASCII banner. If omitted, a default banner is used.
    # ······························································
    # :   ____       _   _   _   ___             _                 :
    # :  |  _ \ ___ | |_| |_(_) / _ \ _   _  ___| |_               :
    # :  | |_) / _ \| __| __| |/ /_\/| | | |/ _ \ __|              :
    # :  |  __/ (_) | |_| |_| / /_\\ | |_| |  __/ |_               :
    # :  |_|   \___/ \__|\__|_|\____/ \__,_|\___|\__|              :
    # ······························································

# ------------------------------------------------------------------------------
# Navigation Sections (Tabs)
# [REQUIRED] Must have at least 1 section.
# Tabs appear in the exact order listed below.
#
# Supported section types:
#   1. text        - Free-form text or bio
#   2. skill_list  - Categorized skills with optional progress bars (0-100)
#   3. timeline    - Work experience, education, or history milestones
#   4. projects    - Expandable showcase projects
#   5. key_value   - Contact info, social links, or specs
# ------------------------------------------------------------------------------
sections:

  # ----------------------------------------------------------------------------
  # 1. Text Section (e.g., About / Bio)
  # ----------------------------------------------------------------------------
  - title: "About"                       # [REQUIRED] Tab name
    icon: ""                            # [OPTIONAL] Nerd Font icon
    type: "text"                         # [REQUIRED] Section type
    content: |                           # [REQUIRED for 'text']
      Hello! I'm a software engineer passionate about building reliable,
      high-throughput systems and clean command-line tools.

      Feel free to explore my experience and projects using the tabs above.

  # ----------------------------------------------------------------------------
  # 2. Skill List Section
  # ----------------------------------------------------------------------------
  - title: "Skills"                      # [REQUIRED] Tab name
    icon: ""                            # [OPTIONAL] Nerd Font icon
    type: "skill_list"                   # [REQUIRED] Section type
    categories:                          # [REQUIRED for 'skill_list']
      - name: "Languages"                # Category name
        icon: ""                        # [OPTIONAL] Category icon
        items:
          - name: "Go"                   # [REQUIRED] Skill name
            icon: ""                    # [OPTIONAL] Skill icon
            level: 90                    # [OPTIONAL] Proficiency percentage (0-100)
          - name: "Python"
            icon: ""
            level: 80
          - name: "TypeScript"
            icon: ""
            level: 75

      - name: "Databases & Tools"
        icon: "󰆼"
        items:
          - name: "PostgreSQL"
            icon: ""
            level: 85
          - name: "Docker"
            icon: ""
            level: 80
          - name: "Linux"
            icon: ""
            level: 90

  # ----------------------------------------------------------------------------
  # 3. Timeline Section (Work Experience / Education)
  # ----------------------------------------------------------------------------
  - title: "Experience"                  # [REQUIRED] Tab name
    icon: ""                            # [OPTIONAL] Nerd Font icon
    type: "timeline"                     # [REQUIRED] Section type
    timeline_items:                      # [REQUIRED for 'timeline']
      - title: "Senior Backend Engineer" # [REQUIRED] Role or Degree
        subtitle: "Acme Corp"            # [REQUIRED] Company or Institution
        icon: "󰞏"                        # [OPTIONAL] Icon
        period: "2023 - Present"         # [OPTIONAL] Date range
        location: "San Francisco, CA"    # [OPTIONAL] Location
        tech: "Go · Kubernetes · gRPC"   # [OPTIONAL] Tech stack summary
        bullets:                         # [OPTIONAL] Bullet points
          - "Architected real-time streaming services handling 50k+ req/sec."
          - "Reduced p99 latency by 35% through connection pooling and caching."

      - title: "B.S. in Computer Science"
        subtitle: "University of Technology"
        period: "2019 - 2023"
        location: "Boston, MA"
        bullets:
          - "Graduated Magna Cum Laude with honors in distributed computing."

  # ----------------------------------------------------------------------------
  # 4. Projects Section (Expandable Cards)
  # ----------------------------------------------------------------------------
  - title: "Projects"                    # [REQUIRED] Tab name
    icon: ""                            # [OPTIONAL] Nerd Font icon
    type: "projects"                     # [REQUIRED] Section type
    projects:                            # [REQUIRED for 'projects']
      - name: "ssh-portfolio"            # [REQUIRED] Project title
        tagline: "SSH-accessible TUI"    # [OPTIONAL] Brief description
        icon: "󰒋"                        # [OPTIONAL] Icon
        tech: "Go · Wish · Bubble Tea"   # [OPTIONAL] Technologies used
        url: "https://github.com/example/ssh-portfolio" # [OPTIONAL] Repo link
        bullets:                         # [OPTIONAL] Feature list / details
          - "Config-driven dynamic tabs and layouts."
          - "Supports SCP resume download and custom theme palettes."

  # ----------------------------------------------------------------------------
  # 5. Key-Value Section (Contact / Socials / Quick Facts)
  # ----------------------------------------------------------------------------
  - title: "Contact"                     # [REQUIRED] Tab name
    icon: ""                            # [OPTIONAL] Nerd Font icon
    type: "key_value"                    # [REQUIRED] Section type
    key_value_items:                     # [REQUIRED for 'key_value']
      - key: "Email"                     # [REQUIRED] Key label
        icon: "󰇮"                        # [OPTIONAL] Icon
        value: "jane@example.com"        # [REQUIRED] Value
      - key: "GitHub"
        icon: ""
        value: "github.com/janedoe"
      - key: "LinkedIn"
        icon: "󰌻"
        value: "linkedin.com/in/janedoe"
      - key: "Website"
        icon: "󰖟"
        value: "https://janedoe.dev"
      - key: "Resume"
        icon: "󰈔"
        value: "scp -P 2222 localhost:resume/sample_resume.pdf ./"
